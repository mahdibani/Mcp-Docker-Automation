[project]
name = "mcp-docker-automation"
version = "0.1.0"
description = "Manage Docker containers in plain English: an LLM picks MCP tools, Docker does the work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "google-genai>=2.29.0",
    "mcp>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
dockai = "dockai.cli:main"
dockai-server = "dockai.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockai"]
